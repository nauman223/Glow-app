<svg
  class="app-brand-logo__mark"
  focusable="false"
  [attr.viewBox]="viewBox()"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.aria-hidden]="decorative()"
  [attr.role]="role()"
  [attr.aria-label]="accessibleName()"
>
  <defs>
    <linearGradient x1="0" y1="0" x2="1" y2="1" [attr.id]="gradientId">
      <stop offset="0" stop-color="#7C4DFF" />
      <stop offset="1" stop-color="#00E5FF" />
    </linearGradient>
  </defs>
  @if (tile()) {
    <rect class="app-brand-logo__tile" x="32" y="32" width="448" height="448" rx="128" />
  }
  <rect
    x="110"
    y="120"
    width="210"
    height="210"
    rx="48"
    fill="none"
    stroke-width="30"
    [attr.stroke]="gradientUrl"
  />
  <rect x="192" y="182" width="210" height="210" rx="48" opacity="0.92" [attr.fill]="gradientUrl" />
  <rect x="212" y="200" width="70" height="16" rx="8" fill="#FFFFFF" opacity="0.55" />
  <path
    d="M150 400C210 330 300 300 410 290"
    stroke="#FFFFFF"
    stroke-width="22"
    stroke-linecap="round"
    fill="none"
  />
</svg>
@if (showWordmark()) {
  <span class="app-brand-logo__wordmark">{{ wordmark }}</span>
}
