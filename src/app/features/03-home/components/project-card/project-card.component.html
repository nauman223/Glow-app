@let view = project();
<article class="project-card">
  <button
    type="button"
    class="project-card__open"
    [disabled]="disabled()"
    [attr.aria-label]="view.openLabel"
    (click)="opened.emit(view.id)"
  >
    @if (view.thumbnailUrl; as url) {
      <img
        class="project-card__thumb"
        [src]="url"
        alt=""
        width="140"
        height="96"
        loading="lazy"
        decoding="async"
      />
    } @else {
      <span class="project-card__thumb project-card__thumb--empty">
        <app-icon name="image-placeholder" [size]="28" />
      </span>
    }
    <span class="project-card__text" aria-hidden="true">
      <span class="project-card__title">{{ view.title }}</span>
      <span class="project-card__date">{{ view.dateLabel }}</span>
    </span>
  </button>
  <button
    type="button"
    class="project-card__more"
    [disabled]="disabled()"
    [attr.aria-label]="view.optionsLabel"
    (click)="optionsRequested.emit(view.id)"
  >
    <app-icon name="more-vert" [size]="20" />
  </button>
</article>
