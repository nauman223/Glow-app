<div class="layer__stack">
  <app-photo-scene class="layer__base" scene="forest" />
  <app-photo-scene class="layer__overlay" scene="selfie" />
  <span class="layer__handle layer__handle--top-end"></span>
  <span class="layer__handle layer__handle--bottom-end"></span>
  <span class="layer__handle layer__handle--bottom-start"></span>
</div>
<div class="layer__control">
  <span class="layer__label">{{ strings.opacity }}</span>
  <span class="layer__track"><span class="layer__thumb"></span></span>
  <span class="layer__value">{{ strings.opacityValue }}</span>
</div>
