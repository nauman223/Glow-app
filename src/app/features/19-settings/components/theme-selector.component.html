<fieldset class="app-theme-selector">
  <legend class="visually-hidden">{{ legend }}</legend>
  @for (option of options; track option.mode) {
    <label class="app-theme-selector__option">
      <input
        class="form-check-input"
        type="radio"
        name="theme-mode"
        [value]="option.mode"
        [checked]="option.mode === mode()"
        (change)="modeChange.emit(option.mode)"
      />
      <app-icon [name]="option.icon" [size]="20" />
      <span>{{ option.label }}</span>
    </label>
  }
</fieldset>
