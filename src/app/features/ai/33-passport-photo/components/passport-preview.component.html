<div class="passport-preview__frame">
  @if (src(); as src) {
    <img class="passport-preview__photo" decoding="async" [src]="src" [alt]="strings.previewAlt" />
    @if (guides()) {
      <div class="passport-preview__guides" role="img" [attr.aria-label]="strings.guidesLabel">
        <span class="passport-preview__line passport-preview__line--crown">{{
          strings.crown
        }}</span>
        <span class="passport-preview__line passport-preview__line--chin">{{ strings.chin }}</span>
        <span class="passport-preview__oval"></span>
      </div>
    }
  }
  @if (busy()) {
    <app-skeleton class="passport-preview__shimmer" width="100%" height="100%" />
  }
</div>

@if (items().length > 0) {
  <ul class="passport-preview__checks" [attr.aria-label]="strings.checksLabel">
    @for (item of items(); track item.id) {
      <li class="passport-preview__check" [class.passport-preview__check--failed]="!item.passed">
        <app-icon [name]="item.passed ? 'check' : 'info'" [size]="16" />
        {{ item.label }}
        @if (!item.passed) {
          <span class="visually-hidden">: {{ strings.checkFailed }}</span>
        }
      </li>
    }
  </ul>
}
