<div class="sticker-stage__fit">
  <!-- Tap-to-pick is a pointer gesture; screen-reader users choose Person instead. -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div
    class="sticker-stage__frame"
    [class.sticker-stage__frame--pickable]="pickable()"
    (click)="onFrameClick($event)"
  >
    @if (ghostSrc(); as photo) {
      <img
        class="sticker-stage__layer sticker-stage__ghost"
        [class.sticker-stage__ghost--faint]="stickerSrc() !== null"
        decoding="async"
        alt=""
        [src]="photo"
      />
    }
    @if (stickerSrc(); as sticker) {
      <img class="sticker-stage__layer" decoding="async" [src]="sticker" [alt]="label()" />
    }
    @if (shimmer()) {
      <app-skeleton class="sticker-stage__layer" width="100%" height="100%" />
    }
  </div>

  @if (busy()) {
    <p class="sticker-stage__pill" role="status">{{ busyLabel() }}</p>
  }
</div>
