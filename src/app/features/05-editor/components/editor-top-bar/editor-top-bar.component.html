@if (toolTitle(); as title) {
  <h1 class="top-bar__title">{{ title }}</h1>
} @else {
  <div class="top-bar">
    <h1 class="visually-hidden">{{ strings.title }}</h1>
    <button
      type="button"
      class="top-bar__icon"
      [attr.aria-label]="strings.back"
      (click)="back.emit()"
    >
      <app-icon name="arrow-back" />
    </button>
    <span class="top-bar__spacer"></span>
    <button
      type="button"
      class="top-bar__icon"
      [disabled]="!canUndo()"
      [attr.aria-label]="undoLabel()"
      (click)="undo.emit()"
    >
      <app-icon name="undo" [size]="22" />
    </button>
    <button
      type="button"
      class="top-bar__icon"
      [disabled]="!canRedo()"
      [attr.aria-label]="redoLabel()"
      (click)="redo.emit()"
    >
      <app-icon name="redo" [size]="22" />
    </button>
    <button
      type="button"
      class="top-bar__icon top-bar__layers"
      aria-haspopup="dialog"
      [disabled]="exportDisabled()"
      [attr.aria-label]="layersLabel()"
      (click)="layersRequested.emit()"
    >
      <app-icon name="layers" [size]="22" />
      <span class="top-bar__badge" aria-hidden="true">{{ layerCount() }}</span>
    </button>
    <button
      type="button"
      class="top-bar__icon"
      aria-haspopup="dialog"
      [disabled]="exportDisabled()"
      [attr.aria-label]="barStrings.moreOptions"
      (click)="moreRequested.emit()"
    >
      <app-icon name="more-vert" [size]="22" />
    </button>
    <button
      type="button"
      class="top-bar__export"
      [disabled]="exportDisabled()"
      (click)="exportRequested.emit()"
    >
      {{ strings.export }}
    </button>
  </div>
}
