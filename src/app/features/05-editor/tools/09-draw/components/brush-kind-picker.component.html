<div class="brush-kinds" role="group" [attr.aria-label]="strings.brushTypes">
  @for (option of options(); track option.kind) {
    <button
      type="button"
      class="brush-kinds__button"
      [class.brush-kinds__button--selected]="option.selected"
      [attr.aria-pressed]="option.selected"
      (click)="kindChange.emit(option.kind)"
    >
      <app-icon [name]="option.icon" [size]="20" />
      <span>{{ option.label }}</span>
    </button>
  }
</div>
