<!doctype html>
<html>
  <body>
    <script>
      // Procedural, original sky art for Glow (no third-party imagery).
      const W = 1280;
      const H = 854;
      const THUMB = 136;

      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function makeNoise(seed) {
        const rand = mulberry32(seed);
        const size = 256;
        const grid = new Float32Array(size * size);
        for (let i = 0; i < grid.length; i++) grid[i] = rand();
        const fade = (t) => t * t * (3 - 2 * t);
        function value(x, y) {
          const xi = Math.floor(x),
            yi = Math.floor(y);
          const xf = fade(x - xi),
            yf = fade(y - yi);
          const x0 = ((xi % size) + size) % size,
            y0 = ((yi % size) + size) % size;
          const x1 = (x0 + 1) % size,
            y1 = (y0 + 1) % size;
          const a = grid[y0 * size + x0],
            b = grid[y0 * size + x1];
          const c = grid[y1 * size + x0],
            d = grid[y1 * size + x1];
          return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
        }
        return function fbm(x, y, octaves = 5) {
          let sum = 0,
            amp = 0.5,
            freq = 1,
            norm = 0;
          for (let o = 0; o < octaves; o++) {
            sum += amp * value(x * freq, y * freq);
            norm += amp;
            amp *= 0.5;
            freq *= 2.03;
          }
          return sum / norm;
        };
      }

      function hex(c) {
        return [
          parseInt(c.slice(1, 3), 16),
          parseInt(c.slice(3, 5), 16),
          parseInt(c.slice(5, 7), 16),
        ];
      }

      function gradientAt(stops, t) {
        for (let i = 1; i < stops.length; i++) {
          if (t <= stops[i][0]) {
            const [t0, c0] = stops[i - 1];
            const [t1, c1] = stops[i];
            const k = (t - t0) / Math.max(t1 - t0, 1e-6);
            return [0, 1, 2].map((j) => c0[j] + (c1[j] - c0[j]) * k);
          }
        }
        return stops[stops.length - 1][1];
      }

      const smooth = (a, b, x) => {
        const t = Math.min(Math.max((x - a) / (b - a), 0), 1);
        return t * t * (3 - 2 * t);
      };
      const mix = (a, b, k) => [
        a[0] + (b[0] - a[0]) * k,
        a[1] + (b[1] - a[1]) * k,
        a[2] + (b[2] - a[2]) * k,
      ];

      function render(id, pixel, post) {
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(W, H);
        const rand = mulberry32(id.length * 977);
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const c = pixel(x / W, y / H);
            const i = (y * W + x) * 4;
            // Light dithering avoids gradient banding after compression.
            const n = (rand() - 0.5) * 2;
            img.data[i] = c[0] + n;
            img.data[i + 1] = c[1] + n;
            img.data[i + 2] = c[2] + n;
            img.data[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        if (post) post(ctx);
        const full = canvas.toDataURL('image/webp', 0.8);
        const thumb = document.createElement('canvas');
        thumb.width = THUMB;
        thumb.height = THUMB;
        const tctx = thumb.getContext('2d');
        tctx.imageSmoothingQuality = 'high';
        // Square crop from the centre, like the gallery tile.
        tctx.drawImage(canvas, (W - H) / 2, 0, H, H, 0, 0, THUMB, THUMB);
        const small = thumb.toDataURL('image/webp', 0.85);
        const pre = document.createElement('pre');
        pre.id = id;
        pre.textContent = full + '\n' + small;
        document.body.appendChild(pre);
      }

      function stars(ctx, seed, count, maxRadius, topFraction) {
        const rand = mulberry32(seed);
        for (let s = 0; s < count; s++) {
          const x = rand() * W;
          const y = Math.pow(rand(), 1.4) * H * topFraction;
          const r = 0.4 + Math.pow(rand(), 3) * maxRadius;
          const a = 0.35 + rand() * 0.65;
          ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          if (r > maxRadius * 0.6) {
            const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
            glow.addColorStop(0, `rgba(200,220,255,${(a * 0.35).toFixed(2)})`);
            glow.addColorStop(1, 'rgba(200,220,255,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
          }
        }
      }

      // Aurora
      {
        const fbm = makeNoise(11);
        const sky = [
          [0, hex('#0B1030')],
          [0.45, hex('#1D3A6B')],
          [0.8, hex('#21806F')],
          [1, hex('#2FBF9B')],
        ];
        render(
          'aurora',
          (u, v) => {
            let c = gradientAt(sky, v);
            // Curtains: a wavy ribbon with vertical streaks.
            const centre = 0.42 + 0.12 * Math.sin(u * 5.2 + 1.3) + 0.06 * (fbm(u * 3, 0.5) - 0.5);
            const ribbon = Math.exp(-Math.pow((v - centre) / 0.11, 2));
            const streaks = 0.55 + 0.45 * fbm(u * 38, v * 1.5, 3);
            const k = Math.min(1, ribbon * streaks * 0.85);
            c = mix(c, hex('#7CFFB2'), k * 0.55);
            const upper = Math.exp(-Math.pow((v - centre + 0.13) / 0.08, 2)) * streaks;
            c = mix(c, hex('#8A6BFF'), upper * 0.18);
            return c;
          },
          (ctx) => stars(ctx, 5, 260, 1.8, 0.75),
        );
      }

      // Sunset
      {
        const fbm = makeNoise(23);
        const sky = [
          [0, hex('#3B1E6B')],
          [0.3, hex('#7A2E7E')],
          [0.6, hex('#E0658A')],
          [0.85, hex('#FF9A6B')],
          [1, hex('#FFC27A')],
        ];
        render('sunset', (u, v) => {
          let c = gradientAt(sky, v);
          const sun = Math.exp(-((u - 0.68) ** 2 * 9 + (v - 0.95) ** 2 * 14));
          c = mix(c, hex('#FFE2A8'), sun * 0.7);
          const n = fbm(u * 3.5 + fbm(u * 2, v * 6) * 0.6, v * 9, 5);
          const band = smooth(0.25, 0.5, v) * (1 - smooth(0.78, 0.92, v));
          const cloud = smooth(0.52, 0.72, n) * band;
          c = mix(c, mix(hex('#5B2A6E'), hex('#FF8FA0'), v), cloud * 0.75);
          return c;
        });
      }

      // Blue sky
      {
        const fbm = makeNoise(37);
        const sky = [
          [0, hex('#1F6FC4')],
          [0.55, hex('#4A9BE6')],
          [1, hex('#A8DBFF')],
        ];
        render('blue-sky', (u, v) => {
          let c = gradientAt(sky, v);
          const haze = smooth(0.7, 1, v) * 0.35;
          c = mix(c, hex('#E8F4FF'), haze);
          const wisp = smooth(0.6, 0.85, fbm(u * 2 + v, v * 10, 4)) * 0.18 * (1 - v);
          return mix(c, [255, 255, 255], wisp);
        });
      }

      // Clouds
      {
        const fbm = makeNoise(41);
        const sky = [
          [0, hex('#3C8FD0')],
          [0.6, hex('#79BCE8')],
          [1, hex('#D6EAF8')],
        ];
        render('clouds', (u, v) => {
          let c = gradientAt(sky, v);
          const warp = fbm(u * 2.5, v * 2.5, 3);
          const n = fbm(u * 2.8 + warp * 0.9, v * 4.2 + warp * 0.7, 6);
          const cover = smooth(0.48, 0.66, n);
          const shade = smooth(0.4, 0.8, fbm(u * 6 + 3, v * 8 + 3, 4));
          const cloudColour = mix(hex('#FFFFFF'), hex('#AEBFD0'), shade * 0.55 + v * 0.15);
          c = mix(c, cloudColour, cover * 0.95);
          return c;
        });
      }

      // Starry night
      {
        const fbm = makeNoise(53);
        const sky = [
          [0, hex('#050816')],
          [0.7, hex('#121A3C')],
          [1, hex('#1B2550')],
        ];
        render(
          'starry',
          (u, v) => {
            let c = gradientAt(sky, v);
            // A faint diagonal Milky Way band.
            const d = Math.abs(v - (0.15 + u * 0.55)) / 0.16;
            const band = Math.exp(-d * d) * (0.4 + 0.6 * fbm(u * 8, v * 8, 5));
            c = mix(c, hex('#3A4A80'), band * 0.45);
            return c;
          },
          (ctx) => stars(ctx, 9, 900, 2.0, 1),
        );
      }

      // Storm
      {
        const fbm = makeNoise(67);
        const sky = [
          [0, hex('#20262F')],
          [0.55, hex('#3A4350')],
          [1, hex('#6B7785')],
        ];
        render('storm', (u, v) => {
          let c = gradientAt(sky, v);
          const warp = fbm(u * 2, v * 3, 3);
          const n = fbm(u * 3 + warp, v * 5 + warp * 0.8, 6);
          c = mix(c, hex('#151A21'), smooth(0.35, 0.75, n) * 0.8);
          c = mix(c, hex('#8C97A5'), smooth(0.6, 0.85, fbm(u * 5 + 7, v * 7, 4)) * 0.35 * v);
          return c;
        });
      }
    </script>
  </body>
</html>
